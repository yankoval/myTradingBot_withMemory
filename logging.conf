[loggers]
keys=root,main,trading_bot.methodsCap,trading_bot.utils

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_main]
level=INFO
handlers=consoleHandler,fileHandler
qualname=main
propagate=0

[logger_trading_bot.utils]
level=ERROR
handlers=consoleHandler,fileHandler
qualname=trading_bot.utils
propagate=0

[logger_trading_bot.methodsCap]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=trading_bot.methodsCap
propagate=0

[handler_consoleHandler]
class=StreamHandler
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
formatter=simpleFormatter
maxBytes=1048576
args=('train.log',)


[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s